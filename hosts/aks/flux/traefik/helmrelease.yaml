apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 30m
  releaseName: traefik
  targetNamespace: traefik
  chart:
    spec:
      chart: traefik
      version: "40.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  values:
    service:
      enabled: true
      annotations:
        service.beta.kubernetes.io/azure-pip-name: ${TRAEFIK_PIP_NAME}
        service.beta.kubernetes.io/azure-load-balancer-resource-group: ${TRAEFIK_PIP_RESOURCE_GROUP}
      loadBalancerIP: ${TRAEFIK_LB_IP}
      spec:
        externalTrafficPolicy: Local
        loadBalancerSourceRanges:
          - ${TRAEFIK_ALLOWED_CIDR}
          - ${TRAEFIK_EGRESS_CIDR}
    providers:
      kubernetesCRD:
        enabled: true
      kubernetesIngress:
        enabled: true
    ingressRoute:
      dashboard:
        enabled: false
