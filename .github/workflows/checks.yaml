name: Checks

on:
  pull_request:
    paths-ignore:
      - LICENCE
      - README.md
  push:
    paths-ignore:
      - LICENCE
      - README.md

jobs:
  flake-checker:
    name: Flake Checker
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install jq via Nix
        run: nix profile add nixpkgs#jq

      - name: Extract nixpkgs keys from flake.lock
        id: extract-keys
        shell: bash
        run: |
          nixpkgs_keys=$(jq --raw-output '.nodes.root.inputs | keys | join(",")' flake.lock)
          echo "Extracted nixpkgs keys: $nixpkgs_keys"
          echo "nixpkgs_keys=$nixpkgs_keys" >> "$GITHUB_OUTPUT"

      - name: Check Nix flake inputs
        uses: DeterminateSystems/flake-checker-action@de924abd783455e8429c858962b9e43062d19da1 # v13
        with:
          nixpkgs-keys: ${{ steps.extract-keys.outputs.nixpkgs_keys }}

  check-hosts:
    name: Check ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      NIX_GITHUB_TOKEN: ${{ secrets.NIX_GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            os: ubuntu-latest
            flake: ./hosts/desktop
            output: nixosConfigurations.desktop.config.system.build.toplevel
          - name: laptop
            os: ubuntu-latest
            flake: ./hosts/laptop
            output: nixosConfigurations.laptop.config.system.build.toplevel
          - name: installer
            os: ubuntu-latest
            flake: ./hosts/installer
            output: nixosConfigurations.installer.config.system.build.toplevel
          - name: kubernetes
            os: ubuntu-latest
            flake: ./hosts/server/incus/instances/kubernetes
            output: nixosConfigurations.default.config.system.build.toplevel
          - name: server
            os: ubuntu-latest
            flake: ./hosts/server
            output: nixosConfigurations.server.config.system.build.toplevel
            private_input: true
          - name: macbook
            os: macos-15
            flake: ./hosts/macbook
            output: darwinConfigurations.macbook.system
    steps:

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Evaluate host
        if: matrix.private_input != true
        run: |
          nix eval '${{ matrix.flake }}#${{ matrix.output }}.drvPath'

      - name: Evaluate host with private inputs
        if: matrix.private_input == true && env.NIX_GITHUB_TOKEN != ''
        env:
          NIX_CONFIG: access-tokens = github.com=${{ secrets.NIX_GITHUB_TOKEN }}
        run: |
          nix eval '${{ matrix.flake }}#${{ matrix.output }}.drvPath'

  nix-lint:
    name: Nix Lint
    runs-on: ubuntu-latest
    steps:

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install nix-linter
        run: nix run github:nix-community/nixpkgs-lint -- .

  nix-static-checks:
    name: Nix Static Checks
    runs-on: ubuntu-latest
    steps:

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run deadnix
        run: nix run nixpkgs#deadnix -- .

      - name: Run statix
        run: nix run nixpkgs#statix -- check .

      - name: Check nix formatting
        run: |
          if git ls-files -- '*.nix' | grep -q .; then
            git ls-files -z '*.nix' | xargs -0 nix run nixpkgs#nixfmt -- --check
          fi
